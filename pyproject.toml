[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mk-star-61"
version = "0.1.0"
description = "HID lighting controller for the MK Star 61 keyboard"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0",
    "hid>=1.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
star61 = "server:main"

[tool.setuptools]
py-modules = ["app", "hid_controller", "server", "udev_setup"]
